<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tomato Grower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D pot, plant cards in a left column, one tool shelf along the bottom. Water is blue, health is green, trouble is red. */
:root{
  --bg-top:#e3ece6; --bg-bot:#c9d9cf;
  --ink:#13261b; --ink-2:#496055;
  --line:rgba(19,38,27,.18);
  --panel:rgba(246,250,246,.86);
  --accent:#d43a22; --accent-ink:#ffffff;
  --chip:rgba(19,38,27,.07);
  --ok:#2f8f4e; --warn:#c98a12; --wet:#2f7fb8; --bad:#c9342a; --zone:rgba(47,143,78,.26);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#1d3427; --bg-bot:#0c1812;
    --ink:#e8f1ea; --ink-2:#9db4a5;
    --line:rgba(232,241,234,.2);
    --panel:rgba(14,28,20,.84);
    --accent:#ff6a4a; --accent-ink:#1a0a05;
    --chip:rgba(232,241,234,.09);
    --ok:#5fd48a; --warn:#f0b84a; --wet:#6cb8f0; --bad:#ff7a63; --zone:rgba(95,212,138,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#1d3427; --bg-bot:#0c1812;
  --ink:#e8f1ea; --ink-2:#9db4a5;
  --line:rgba(232,241,234,.2);
  --panel:rgba(14,28,20,.84);
  --accent:#ff6a4a; --accent-ink:#1a0a05;
  --chip:rgba(232,241,234,.09);
  --ok:#5fd48a; --warn:#f0b84a; --wet:#6cb8f0; --bad:#ff7a63; --zone:rgba(95,212,138,.22);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg-bot);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden}
.app{position:relative;height:100%}
#stage{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 28%,var(--bg-top),var(--bg-bot))}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px;padding:14px 16px;pointer-events:none}
.top>*{pointer-events:auto}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.brand p{margin:4px 0 0;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg-bot);border-color:var(--ink)}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.speed button{border:0;background:transparent;padding:7px 12px;font-family:var(--font-mono);font-size:.76rem}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg-bot)}
.speed-label{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3;white-space:nowrap}
.toast.show{opacity:1}

.bottom{position:absolute;left:16px;right:16px;bottom:16px;display:grid;justify-items:center;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.tip{margin:0;max-width:min(600px,100%);padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.82rem;text-align:center;line-height:1.35}
.toolbar{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tool{display:grid;justify-items:center;gap:3px;min-width:96px;padding:10px 14px 7px;border:1px solid transparent;border-radius:12px;background:var(--chip);font-weight:600;font-size:.82rem}
.tool:hover{border-color:var(--line)}
.tool svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool kbd{font-family:var(--font-mono);font-size:.62rem;color:var(--ink-2);font-weight:400}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] kbd{color:inherit;opacity:.8}

.garden{position:fixed;top:84px;left:16px;width:264px;max-height:calc(100% - 270px);overflow-y:auto;display:grid;gap:10px;align-content:start;pointer-events:none}
.garden>*{pointer-events:auto}
.garden.hidden{display:none}
.empty{margin:0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--panel);font-size:.82rem;line-height:1.4;color:var(--ink-2)}
.card{display:grid;gap:7px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
.card header{display:flex;align-items:center;gap:8px}
.card header strong{font-family:var(--font-display);font-size:.98rem;letter-spacing:-.01em}
.card .x{margin-left:auto;width:24px;height:24px;border:0;border-radius:50%;background:var(--chip);font-size:1rem;line-height:1;display:grid;place-items:center}
.card .x:hover{background:var(--line)}
.stage{margin:0;font-size:.76rem;color:var(--ink-2)}
.chip{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.wet{color:var(--wet)} .chip.bad{color:var(--bad)} .chip.idle{color:var(--ink-2)}
.meter{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:8px}
.meter span{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;display:block}
.bar .zone{left:23%;width:50%;background:var(--zone)}
.bar .fill{border-radius:4px;background:var(--ok);transition:width .25s}
.card[data-s="warn"] .fill.water{background:var(--warn)}
.card[data-s="wet"] .fill.water{background:var(--wet)}
.card[data-s="bad"] .fill.water{background:var(--bad)}
.card[data-s="idle"] .fill.water{background:var(--ink-2)}
.fill.health{background:var(--ok)}
.bar .pnr{left:20%;width:2px;background:var(--bad);opacity:.85}
.card[data-s="bad"] .fill.health{background:var(--bad)}
.note{margin:0;font-size:.74rem;line-height:1.35;color:var(--ink-2);min-height:1.35em}

@media (max-width:860px){
  .garden{position:static;width:100%;max-height:none;display:flex;overflow-x:auto;overflow-y:hidden;pointer-events:auto;padding-bottom:2px}
  .card{flex:0 0 228px}
  .empty{flex:1}
  .toast{top:96px}
}
@media (max-width:560px){
  .tool{min-width:0;flex:1;padding:8px 8px 6px}
  .toolbar{width:100%}
  .brand h1{font-size:1.2rem}
  .speed-label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<main class="app">
  <div id="stage"><canvas id="gl" role="img" aria-label="A 3D raised garden bed with cherry tomato plants. Drag to orbit, right-drag to pan, scroll to zoom."></canvas></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <header class="top">
    <div class="brand">
      <h1>Tomato Grower</h1>
      <p>Garden day <span id="gDay">0</span> · harvested <span id="gHarv">0</span></p>
    </div>
    <div class="top-actions">
      <span class="speed-label">Timelapse</span>
      <div class="speed" role="group" aria-label="Timelapse speed">
        <button type="button" data-speed="0" aria-pressed="false">Pause</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
      </div>
      <button class="btn toggle" id="panelBtn" type="button" aria-pressed="true">Plant status</button>
      <button class="btn toggle" id="auto" type="button" aria-pressed="false">Auto-water</button>
      <button class="btn toggle" id="roots" type="button" aria-pressed="true">Roots</button>
      <button class="btn toggle" id="spin" type="button" aria-pressed="false">Auto-rotate</button>
      <button class="btn" id="clear" type="button">Clear bed</button>
    </div>
  </header>

  <section class="bottom">
    <aside class="garden" id="garden" aria-label="Your plants">
      <p class="empty" id="gardenEmpty">No plants yet. Choose Seed, then click the soil to plant one.</p>
    </aside>
    <p class="tip" id="tip"></p>
    <div class="toolbar" role="toolbar" aria-label="Tools">
      <button class="tool" type="button" data-tool="seed" aria-pressed="true">
        <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 22v-8"/><path d="M13 14c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M13 12c0-3.5 2.5-5.5 6.5-5.5 0 3.5-2.5 5.5-6.5 5.5z"/><path d="M5 22h16"/></svg>
        Seed<kbd>1</kbd></button>
      <button class="tool" type="button" data-tool="water" aria-pressed="false">
        <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3.5c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.500 6-11z"/><path d="M10 15.500a3 3 0 0 0 2.500 2.800"/></svg>
        Water<kbd>2</kbd></button>
      <button class="tool" type="button" data-tool="trellis" aria-pressed="false">
        <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M6 23V3M20 23V3"/><path d="M6 8h14M6 14h14M6 20h14"/></svg>
        Trellis<kbd>3</kbd></button>
      <button class="tool" type="button" data-tool="prune" aria-pressed="false">
        <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="7" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M9 17L19 4M17 17L7 4"/></svg>
        Pick &amp; prune<kbd>4</kbd></button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

const MAX_DAY=140;           // days from sowing; 1 world unit = 10 cm
const HX=8, HZ=4, BED_BOTTOM=-3.4;   // garden bed half-width, half-depth, floor
const SEED_POS=new THREE.Vector3(0,-0.06,0), HYPO=0.62;
let clock=0, pendingSpawns=[];
const UP=new THREE.Vector3(0,1,0), ZAXIS=new THREE.Vector3(0,0,1), XAXIS=new THREE.Vector3(1,0,0);

const STAGES=[
 [0,'Seed','Buried in moist soil, the dry seed soaks up water and swells.'],
 [4,'Germination','The seed coat splits. The radicle, the first root, turns downward and anchors the plant.'],
 [7,'Emergence','The hypocotyl pushes up through the soil as a hook, dragging the folded seed leaves behind it.'],
 [12,'Seedling','The two cotyledons open and begin photosynthesis. Lateral roots start to branch.'],
 [19,'Vegetative growth','A new compound leaf unfurls at every node while the stem thickens and side shoots form.'],
 [48,'Flowering','Flower buds form on trusses and open yellow. A shake of the anther cone releases pollen.'],
 [61,'Fruit set','Petals drop and the pollinated ovaries swell into small green tomatoes.'],
 [80,'Ripening','Chlorophyll breaks down and lycopene builds. Green fruit turns orange, then red.'],
 [98,'Harvest','The lowest clusters are ripe and ready to pick. Old lower leaves yellow and drop while the top keeps growing.']
];

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,0.03,300);

scene.add(new THREE.HemisphereLight(0xeaf5ff,0x3d3a2a,0.9));
const sun=new THREE.DirectionalLight(0xfff0d8,0.95);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0006;
sun.shadow.normalBias=0.015;
sun.shadow.camera.near=1; sun.shadow.camera.far=200;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xbcd4ff,0.3);
fill.position.set(-6,3,-5); scene.add(fill);

/* ---------- raised bed and soil ---------- */
function hash2(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);
}
const groundY=(x,z)=>0.05*(vnoise(x*2+3,z*2+7)-0.5)+0.022*(vnoise(x*7+1,z*7+5)-0.5);
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function soilTextures(){
  const S=512, r=rng(7), pal=['#241710','#2f2016','#3d2a1b','#4b3523','#5d442d','#6e5339'];
  const cc=mkCanvas(S,S), bc=mkCanvas(S,S), g=cc.getContext('2d'), b=bc.getContext('2d');
  g.fillStyle='#3a2819'; g.fillRect(0,0,S,S); b.fillStyle='#808080'; b.fillRect(0,0,S,S);
  for(let i=0;i<170;i++){
    const x=r()*S,y=r()*S,rad=14+r()*60,dark=r()<0.55;
    for(const [ctx,col] of [[g,dark?'rgba(18,10,5,0.2)':'rgba(125,92,60,0.14)'],[b,dark?'rgba(40,40,40,0.25)':'rgba(190,190,190,0.2)']]){
      const gr=ctx.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
    }
  }
  for(let i=0;i<15000;i++){
    const x=r()*S,y=r()*S,s=1+r()*2.6,a=0.4+r()*0.5,l=50+r()*140|0;
    g.globalAlpha=a; g.fillStyle=pal[r()*pal.length|0]; g.fillRect(x,y,s,s);
    b.globalAlpha=a; b.fillStyle='rgb('+l+','+l+','+l+')'; b.fillRect(x,y,s,s);
  }
  g.globalAlpha=1; b.globalAlpha=1;
  for(let i=0;i<230;i++){   // perlite
    const x=r()*S,y=r()*S,rad=1+r()*2.4;
    g.fillStyle='rgba(224,218,202,0.92)'; g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
    b.fillStyle='#d8d8d8'; b.beginPath(); b.arc(x,y,rad,0,TAU); b.fill();
  }
  for(let i=0;i<110;i++){   // bark and root fragments
    const x=r()*S,y=r()*S,a=r()*Math.PI,w=3+r()*7;
    for(const [ctx,col] of [[g,r()<0.5?'#5b3b22':'#7a5230'],[b,'#a0a0a0']]){
      ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle=col; ctx.fillRect(-w/2,-0.7,w,1.4+r()); ctx.restore();
    }
  }
  const mk=c=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,4);t.anisotropy=4;return t;};
  return {map:mk(cc),bump:mk(bc)};
}
function wallTexture(){
  const c=mkCanvas(256,512), g=c.getContext('2d'), r=rng(11);
  const gr=g.createLinearGradient(0,0,0,512); gr.addColorStop(0,'#4d3827'); gr.addColorStop(1,'#271a11');
  g.fillStyle=gr; g.fillRect(0,0,256,512);
  const pal=['#1e130b','#3b2a1b','#5d442d','#6e5339'];
  for(let i=0;i<5000;i++){g.globalAlpha=0.4+r()*0.5;g.fillStyle=pal[r()*pal.length|0];const s=1+r()*3;g.fillRect(r()*256,r()*512,s,s);}
  g.globalAlpha=1;
  for(let i=0;i<150;i++){g.fillStyle='rgba(224,218,202,0.9)';g.beginPath();g.arc(r()*256,r()*512,1+r()*2.2,0,TAU);g.fill();}
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.repeat.set(4,1); return t;
}
/* ---------- procedural textures: leaf veins, wood grain, bamboo, fruit skin ---------- */
function leafTextures(){
  const W=512,H=256, r=rng(5), cc=mkCanvas(W,H), bc=mkCanvas(W,H), g=cc.getContext('2d'), b=bc.getContext('2d');
  g.fillStyle='#d6d6d6'; g.fillRect(0,0,W,H); b.fillStyle='#6c6c6c'; b.fillRect(0,0,W,H);
  for(let i=0;i<300;i++){
    const x=r()*W,y=r()*H,rad=10+r()*38,dark=r()<0.55;
    for(const [ctx,col] of [[g,dark?'rgba(120,120,120,0.1)':'rgba(255,255,255,0.14)'],[b,dark?'rgba(40,40,40,0.12)':'rgba(190,190,190,0.1)']]){
      const gr=ctx.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
    }
  }
  const cy=H/2;
  const stroke=(ctx,x0,y0,qx,qy,x1,y1,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(qx,qy,x1,y1);ctx.stroke();};
  stroke(g,0,cy,W/2,cy,W,cy,8,'#ffffff'); stroke(b,0,cy,W/2,cy,W,cy,8,'#fafafa');
  for(let k=0;k<11;k++){
    const x0=14+k*44, len=100+r()*30;
    for(const sd of [-1,1]){
      const x1=x0+len, y1=cy+sd*(104-k*3.5), qx=x0+len*0.35, qy=cy+sd*(18+r()*14);
      stroke(g,x0,cy,qx,qy,x1,y1,3.2,'rgba(255,255,255,0.95)'); stroke(b,x0,cy,qx,qy,x1,y1,3.2,'#f2f2f2');
      for(let s=1;s<6;s++){
        const t=s/6, px=lerp(lerp(x0,qx,t),lerp(qx,x1,t),t), py=lerp(lerp(cy,qy,t),lerp(qy,y1,t),t);
        const ex=px+26+r()*14, ey=py+sd*(22+r()*16);
        stroke(g,px,py,px+10,py+sd*8,ex,ey,1.3,'rgba(255,255,255,0.6)'); stroke(b,px,py,px+10,py+sd*8,ex,ey,1.3,'rgba(220,220,220,0.8)');
      }
    }
  }
  for(let i=0;i<1400;i++){
    g.fillStyle=r()<0.5?'rgba(255,255,255,0.35)':'rgba(100,100,100,0.12)'; g.fillRect(r()*W,r()*H,1.2,1.2);
    b.fillStyle='rgba(200,200,200,0.4)'; b.fillRect(r()*W,r()*H,1.2,1.2);
  }
  const mk=c=>{const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;};
  return {map:mk(cc),bump:mk(bc)};
}
function woodTexture(){
  const S=256,c=mkCanvas(S,S),g=c.getContext('2d'),r=rng(21);

    this.fruitVisible=true; this.ripe=full;
    this.fruit.visible=true; this.calyx.visible=true;
    this.fruit.position.set(_end.x,_end.y-r*sk*0.78,_end.z);
    this.fruit.scale.set(r*sk,r*sk*this.sq,r*sk);
    this.calyx.position.copy(_end); this.calyx.scale.setScalar(r*sk);

}

  const fallers=()=>({yawL:r()*TAU,dx:(r()-0.5)*1.1,dz:(r()-0.5)*1.1,rollL:(r()-0.5)*0.7});

  for(let k=0;k<NODES;k++){
    const size=(k<6?0.55+0.07*k:0.97-0.25*smooth((k-16)/7))*(0.8+0.4*r());
    leaves.push(new Leaf(Object.assign({axis:mainAxis,s:nodeS(k),theta:thetaOf(k)+0.5*(r()-0.5),size,dur:14+6*size,gseed:Math.floor(r()*4e9),frac:k/22,
      pitchM:lerp(-0.3,0.55,k/22)+r()*0.3-0.15,droopy:k<10?1.2:0.6,life:k<=13?52+3*k:1e9,phase:r()*6},fallers())));

  });

  const addShoot=(parent,sK,th,Lf,birth,depth)=>{

      Lfn:d=>Lf*smooth((d-birth)/50),
      dirFn:(sf)=>{const o=1-0.85*smooth(sf*1.4);return tmp.set(ox*o*0.9+Math.sin(sf*5+wob)*0.08,0.35+1.2*smooth(sf),oz*o*0.9+Math.cos(sf*4+wob)*0.08);}});

    const n=Math.max(2,Math.floor(Lf/0.46)), subAt=depth===0&&Lf>2.4?Math.floor(n*(0.35+0.2*r())):-1;
    for(let m=0;m<n;m++){
      const sz=(0.42+0.26*Math.sin(Math.PI*(m+0.8)/(n+0.6)))*(0.78+0.45*r())*(depth?0.8:1);
      leaves.push(new Leaf(Object.assign({axis:shoot,s:0.26+m*0.46,theta:m*2.5133+r(),size:sz,dur:13,gseed:Math.floor(r()*4e9),frac:0.5,
        pitchM:0.3+r()*0.2,droopy:0.8,life:m<n*0.4?58+6*m:1e9,phase:r()*6},fallers())));
    }
    if(subAt>=0){
      const sS=0.26+subAt*0.46+0.1;
      addShoot(shoot,sS,th+2.2,1.3+0.9*r(),shoot.reachDay(sS)+6,1);
    }
    if(depth===0&&Lf>2.2){

    if(wz>HZ-0.5)v.z-=(wz-HZ+0.5)*6; else if(wz<-HZ+0.5)v.z+=(-HZ+0.5-wz)*6;

    base0:rootBase,
    Lfn:d=>TAPL*(1-Math.pow(1-clamp((d-4)/60),2.2)), radiusFn:stemR,
    dirFn:(sf,p)=>steer(tmp.set(Math.sin(sf*5+ra)*0.18,-1,Math.cos(sf*4+rb2)*0.18),p)});

  const rootAxis=(parent,sP,Lf,birth,dur,out,wob,N,fac)=>{
    const a=new Axis({kind:'root',batch:rbatch,parent,parentS:sP,N,M:5,Lfinal:Lf,col:C_ROOT,cast:false,tipRatio:0.15,rFactor:fac,rMin:0.0035,
      Lfn:d=>Lf*smooth((d-birth)/dur),
      dirFn:(sf,p)=>steer(tmp.set(Math.cos(out)*1+Math.sin(sf*7+wob)*0.2,-(0.3+1.1*sf),Math.sin(out)*1+Math.cos(sf*6+wob)*0.2),p)});

  };

    const sA=0.01+0.09*r(), Lf=1.8+1.6*r();

  }
  for(let q=0;q<30;q++){
    const sT=0.3+q*(2.4/29), Lf=(0.9+1.8*(1-sT/2.9))*(0.6+0.7*r()), birth=tap.reachDay(sT)+2, out=r()*TAU;

    for(let a=0;a<ns;a++){
      const sS=Lf*(0.2+0.7*r()), L2=0.35+0.7*r();
      const sub=rootAxis(lat,sS,L2,lat.reachDay(sS)+2,20,r()*TAU,r()*6,12,0.5);

  }

}
/* Re-roll any cherry tomato whose final position touches another until none overlap. */
function relaxFruit(P){
  const axes=P.axes, blossoms=P.blossoms;
  for(const a of axes)if(a.kind!=='root')a.update(MAX_DAY);
  const rr=rng(P.seed+99), C=blossoms.map(()=>new THREE.Vector3());
  for(let it=0;it<150;it++){
    blossoms.forEach((b,i)=>b.centerAt(MAX_DAY,C[i]));
    let bad=0;
    for(let i=0;i<blossoms.length;i++)for(let j=i+1;j<blossoms.length;j++){
      if(C[i].distanceTo(C[j])<(blossoms[i].R+blossoms[j].R)*1.2){
        bad++; const b=blossoms[j];
        b.az=(rr()<0.5?-1:1)*(0.5+1.1*rr()); b.sv=0.85+0.7*rr();
      }
    }
    if(!bad)break;
  }
  for(const a of axes)if(a.kind!=='root')a.update(0);
}

/* ---------- garden state: moisture field, plants, trellises ---------- */
const MAXP=10, MIN_GAP=1.3, MAXT=8, TRELLIS_W=1.6, TRELLIS_H=13, TIE_Y0=1.0, TIE_DY=1.6;
const BASE_RATE=0.25;   // garden days per real second at 1x
let autoWater=false, harvested=0, harvestedRipe=0, plants=[], trellises=[], plantCounter=0, speed=1, tool='seed', trellisSpin=0;
const GNX=64, GNZ=32, CELL=2*HX/GNX, field=new Float32Array(GNX*GNZ), fieldTmp=new Float32Array(GNX*GNZ);
const MOIST_MAX=1.3;
function sampleField(x,z){
  const gx=clamp((x+HX)/CELL-0.5,0,GNX-1.001), gz=clamp((z+HZ)/CELL-0.5,0,GNZ-1.001);
  const i=Math.floor(gx), j=Math.floor(gz), fx=gx-i, fz=gz-j;
  const a=field[j*GNX+i], b=field[j*GNX+i+1], c=field[(j+1)*GNX+i], d=field[(j+1)*GNX+i+1];
  return lerp(lerp(a,b,fx),lerp(c,d,fx),fz);
}
function addWater(x,z,R,amt){
  const i0=Math.max(0,Math.floor((x-R+HX)/CELL)), i1=Math.min(GNX-1,Math.ceil((x+R+HX)/CELL));
  const j0=Math.max(0,Math.floor((z-R+HZ)/CELL)), j1=Math.min(GNZ-1,Math.ceil((z+R+HZ)/CELL));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const cx=(i+0.5)*CELL-HX, cz=(j+0.5)*CELL-HZ, d=Math.hypot(cx-x,cz-z);
    if(d>=R)continue;
    const w=1-d/R, k=j*GNX+i;
    field[k]=clamp(field[k]+amt*w*w*(3-2*w),0,MOIST_MAX);
  }
}
function stepField(dt){   // dt in garden days
  const k=Math.min(0.4,1.2*dt);
  for(let j=0;j<GNZ;j++)for(let i=0;i<GNX;i++){
    const c=j*GNX+i, m=field[c];
    const n=(field[j*GNX+Math.max(0,i-1)]+field[j*GNX+Math.min(GNX-1,i+1)]+field[Math.max(0,j-1)*GNX+i]+field[Math.min(GNZ-1,j+1)*GNX+i])*0.25;
    const v=m+k*(n-m), rate=0.015+(v>0.95?0.06:0)+(v>1.05?0.12:0);
    fieldTmp[c]=Math.max(0,v-rate*dt);
  }
  field.set(fieldTmp);
}
function updateSoilColors(){
  const col=soilGeo.attributes.color, pos=soilGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const m=sampleField(pos.getX(i),-pos.getY(i)), k=lerp(1.4,0.5,smooth(clamp(m))), w=clamp((m-1)/0.3);
    col.setXYZ(i,k*(1-0.15*w),k*(1-0.05*w),k*(1+0.12*w));
  }
  col.needsUpdate=true;
}

/* ---------- trellis: two poles and cross ties, placed by the player ---------- */
const poleMat=new THREE.MeshStandardMaterial({map:bambooTex,roughness:.7}), twineMat=new THREE.MeshStandardMaterial({color:0xe9e3d0,roughness:.9});
function buildTrellisMeshes(h,ghost){
  const g=new THREE.Group(), meshes=[];
  const pm=ghost?ghostTrellisMat:poleMat, tm=ghost?ghostTrellisMat:twineMat;
  for(const x of [-TRELLIS_W/2,TRELLIS_W/2]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,h+0.6,8),pm); p.position.set(x,h/2-0.3,0); p.castShadow=!ghost; g.add(p); meshes.push(p);
  }
  for(let y=TIE_Y0;y<h;y+=TIE_DY){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,TRELLIS_W,5),tm); t.rotation.z=Math.PI/2; t.position.set(0,y,0); g.add(t); meshes.push(t);
  }
  return {g,meshes};
}
const ghostTrellisMat=new THREE.MeshStandardMaterial({color:0xdcc088,transparent:true,opacity:0.55,roughness:.8});
class Trellis{
  constructor(x,z,ang){
    this.x=x;this.z=z;this.ang=ang;
    const {g,meshes}=buildTrellisMeshes(TRELLIS_H,false);
    this.group=g; g.position.set(x,0,z); g.rotation.y=ang; scene.add(g);
    for(const m of meshes)m.userData.owner=this;
    this.meshes=meshes;
    const c=Math.cos(ang), s=Math.sin(ang), h=TRELLIS_W/2;
    this.poles=[{x:x+c*h,z:z-s*h},{x:x-c*h,z:z+s*h}];
  }
  local(px,pz){const dx=px-this.x,dz=pz-this.z,c=Math.cos(this.ang),s=Math.sin(this.ang);return {lx:dx*c-dz*s,lz:dx*s+dz*c};}
  supports(px,pz){const l=this.local(px,pz);return Math.abs(l.lx)<=TRELLIS_W/2+0.4&&Math.abs(l.lz)<=1.3;}
  dispose(){scene.remove(this.group);this.group.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
}
function refreshSupport(){
  for(const P of plants){
    if(P.dead){continue;}
    let best=null,bd=1e9;
    for(const T of trellises){if(T.supports(P.x,P.z)){const d=Math.abs(T.local(P.x,P.z).lz);if(d<bd){bd=d;best=T;}}}
    if(best!==P.trellis){
      if(P.trellis)P.detachTendrils(P.trellis);
      P.trellis=best;
      if(best)P.growTendrils(best);
    }
  }
}

/* A tendril leaves a node, reaches for the nearest pole, then coils around it. */
function planTendril(p0,Lf,N,cx,cz,sign){
  const ds=Lf/N, rc=0.0555, p=p0.clone();
  const ax=p.x-cx, az=p.z-cz, al=Math.hypot(ax,az)||1;
  const tgt=new THREE.Vector3(cx+ax/al*rc,p.y+0.12,cz+az/al*rc);
  const t=new THREE.Vector3(cx-p.x,0.2,cz-p.z).normalize(), d=new THREE.Vector3(), tans=[], alpha=0.32;
  let phase=0, phi=0, yp=0;
  for(let i=0;i<=N;i++){
    if(phase===0){
      d.copy(tgt).sub(p);
      if(d.length()<0.03||i>N*0.55){phase=1;phi=Math.atan2(p.z-cz,p.x-cx);yp=p.y;}
      else{d.normalize();t.lerp(d,0.2).normalize();tans.push(t.clone());p.addScaledVector(t,ds);continue;}
    }
    phi+=sign*ds*Math.cos(alpha)/rc; yp+=ds*Math.sin(alpha);
    d.set(cx+Math.cos(phi)*rc,yp,cz+Math.sin(phi)*rc).sub(p).normalize();
    tans.push(d.clone()); p.addScaledVector(d,ds);
  }
  return tans;
}

/* ---------- Plant: one tomato with its own age, water, health, weight ---------- */
const MAX_AGE=MAX_DAY, DSB=0.5, NB=Math.ceil((12.13-HYPO)/DSB), K_BEND=2e5, ECC=0.07;
class Plant{
  constructor(x,z){
    this.id=++plantCounter; this.x=x; this.z=z; this.seed=Math.floor(Math.random()*9e8);
    this.group=new THREE.Group(); this.group.position.set(x,0,z); scene.add(this.group);
    this.disp=[]; this.axes=[]; this.leaves=[]; this.blossoms=[]; this.aerial=[]; this.tendrils=[]; this.main=null; this.trellis=null;
    this.stemMat=tubeMat.clone(); this.rootMat=tubeMat.clone(); this.disp.push(this.stemMat,this.rootMat);
    this.age=0; this.health=1; this.stress=0; this.wilt=0; this.vigor=0; this.moisture=0; this.rate=0; this.brown=0;
    this.dead=false; this.doomed=false; this.support=0; this.dormant=true; this.deadAttached=0; this.H=0; this.lastAge=-1; this.lastWilt=-1; this.lastBend=0; this.lean=0;
    const a=Math.random()*TAU; this.wx=Math.cos(a); this.wz=Math.sin(a); this.ax=this.wz; this.az=-this.wx;
    this.theta=new Float32Array(NB); this.phiCum=new Float32Array(NB+1); this.massBins=new Float32Array(NB);
    this.xs=new Float32Array(NB+1); this.xm=new Float32Array(NB);

    this.seedMesh.position.set(0,-0.03,0); this.seedMesh.rotation.y=Math.random()*TAU; this.group.add(this.seedMesh);
    this.mound=new THREE.Mesh(moundGeo,moundMat); this.mound.position.set(0.02,groundY(x,z)-0.01,0); this.mound.castShadow=true; this.mound.receiveShadow=true; this.group.add(this.mound);
    this.disp.push(this.seedMat);
    this.sampleMoisture();
  }
  phiAtS(s){

    if(b>=NB)return this.phiCum[NB];

  rootRadius(){return 0.35+0.5*smooth(this.age/40);}
  sampleMoisture(){

const dockEl=document.querySelector('.bottom');
const view={ty:-0.3,dist:22,theta:0.35,user:{dTheta:0,dPhi:0,zoom:1},pan:new THREE.Vector3(),auto:false};
let dragging=false;
function updateCamera(dt,H){
  const top=Math.max(H,0)*1.06+0.9, bottom=lerp(-1.1,-0.5,smooth(H/4)), ext=Math.max(top-bottom,1.7);
  const aspect=camera.aspect, t=Math.tan(camera.fov*Math.PI/360);
  const wNeed=2*HX+3;
  const dockFrac=clamp(dockEl.offsetHeight/Math.max(1,canvas.clientHeight)+0.04,0,0.6), avail=1-dockFrac;
  const dist=Math.max(0.8*ext/2/t*1.1/avail,(wNeed/2)/(t*aspect)*1.02,9);
  const ty=(top+bottom)/2;
  const k=1-Math.exp(-dt*4);
  view.ty+=(ty-view.ty)*k;
  view.dist=Math.exp(lerp(Math.log(view.dist),Math.log(dist),k));
  if(view.auto&&!dragging)view.user.dTheta+=dt*0.16;
  const phi=clamp(lerp(0.9,0.45,smooth(H/8))+view.user.dPhi,-0.12,1.45);
  const th=view.theta+view.user.dTheta, d=view.dist*view.user.zoom;
  const cx=view.pan.x, cy=view.ty*0.6+view.pan.y, cz=view.pan.z;
  camera.position.set(cx+Math.sin(th)*Math.cos(phi)*d,cy+Math.sin(phi)*d,cz+Math.cos(th)*Math.cos(phi)*d);
  camera.lookAt(cx,cy-dockFrac*d*t,cz);
  const sc=sun.shadow.camera, sx=19;
  sc.left=-sx;sc.right=sx;sc.top=sx*0.8;sc.bottom=-sx*0.8;sc.updateProjectionMatrix();
  sun.target.position.set(0,H*0.3,0);
  sun.position.set(0.55*50,0.85*50+H*0.3,0.35*50);
}
const raycaster=new THREE.Raycaster(), _ndc=new THREE.Vector2(), soilPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), _hit=new THREE.Vector3();
function setRay(cx,cy){

function soilHit(cx,cy){

function pickables(){
  const list=[];
  for(const P of plants){
    for(const b of P.blossoms)if(b.fruitVisible&&!b.gone)list.push(b.fruit);
    for(const l of P.leaves)if(l.mesh&&l.mesh.visible&&l.sen>0.5&&!l.removed)list.push(l.mesh);
  }

canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('pointerleave',()=>{if(!pointers.size)hoverOn=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();view.user.zoom=clamp(view.user.zoom*Math.exp(e.deltaY*0.0012),0.06,2.2);},{passive:false});
canvas.addEventListener('dblclick',()=>{view.pan.set(0,0,0);view.user.zoom=1;view.user.dPhi=0;view.user.dTheta=0;});

function resize(){
  const w=canvas.clientWidth||1,h=canvas.clientHeight||1;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(document.getElementById('stage')); resize();

/* ---------- actions ---------- */
const $=id=>document.getElementById(id);
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function addPlantAt(x,z){const P=new Plant(x,z);plants.push(P);addCard(P);refreshSupport();refreshTip();return P;}
function placeSeed(x,z){
  if(plants.length>=MAXP){toast('The bed is full. Uproot a plant to make room.');return;}
  if(!plantSpotOk(x,z)){toast('Too close to another plant or the edge.');return;}
  addPlantAt(x,z);
  toast('Seed planted. Now water the soil around it.');
}
function placeTrellis(x,z){
  if(trellises.length>=MAXT){toast('That is all the trellises you have ('+MAXT+').');return;}
  if(!trellisSpotOk(x,z)){toast('Too close to another trellis or the edge.');return;}
  trellises.push(new Trellis(x,z,trellisAngle()));
  refreshSupport(); refreshTip();
  toast('Trellis placed. Plants within reach will climb it.');
}
function removeTrellis(T){
  trellises=trellises.filter(t=>t!==T); T.dispose(); refreshSupport(); refreshTip();
}
function spawnVolunteers(){
  const list=pendingSpawns; pendingSpawns=[];
  for(const sp of list){
    if(Math.random()>0.6)continue;
    let spot=null;
    for(let i=0;i<14&&!spot;i++){
      const a=Math.random()*TAU, d=i===0?0:0.5+Math.random()*1.3, x=sp.x+Math.cos(a)*d, z=sp.z+Math.sin(a)*d;
      if(plantSpotOk(x,z))spot={x,z};
    }
    if(spot){addPlantAt(spot.x,spot.z);toast('A fallen tomato sprouted a new seedling.');}
  }
}
function removeItem(o){
  if(!o)return;
  if(o instanceof Trellis){removeTrellis(o);toast('Trellis removed.');return;}
  if(o instanceof Blossom){
    o.removed=true;
    if(o.fallClock!==null&&o.rot>0.5)toast('Composted a rotten tomato.');
    else{harvested++;if(o.ripe)harvestedRipe++;toast(o.ripe?'Harvested a ripe cherry tomato':'Picked an unripe tomato');}
  }else{
    const P=o.plant, early=o.dropAt===null;
    o.removed=true; P.vigor=Math.min(0.5,P.vigor+(early?0.12:0.03));
    toast(early?'Dying leaf removed. The plant perks up.':'Fallen leaf cleared.');
  }
}
function uproot(P){
  P.dispose(); plants=plants.filter(q=>q!==P);
  const c=cards.get(P.id); if(c){c.el.remove();cards.delete(P.id);}
  refreshTip();
}
function setTool(t){
  tool=t; pouring=false; hoverOn=false;
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t?'true':'false'));
  canvas.style.cursor='grab'; refreshTip();
}
function setSpeed(s){
  speed=s;
  document.querySelectorAll('.speed button').forEach(b=>b.setAttribute('aria-pressed',parseFloat(b.dataset.speed)===s?'true':'false'));
}
function refreshTip(){
  const el=$('tip'); let msg;
  const dry=plants.find(p=>p.dormant), bad=plants.find(p=>!p.dead&&p.stress>0.25), lean=plants.find(p=>!p.dead&&p.lean>0.35&&!p.trellis);
  if(!plants.length)msg=tool==='seed'?'Click the soil to plant your first seed.':'Plant a seed first. Choose Seed and click the soil.';
  else if(dry&&tool!=='water')msg='A seed is waiting for water. Choose Water and hold on the soil near it.';
  else if(bad&&tool!=='water'&&bad.moisture<0.5)msg='A plant is thirsty. Choose Water to save it.';
  else if(lean&&tool!=='trellis')msg='A plant is leaning under its own weight. Choose Trellis and place one beside it.';
  else msg=tool==='seed'?'Click bare soil to plant another seed ('+plants.length+' of '+MAXP+').'
    :tool==='water'?'Hold the mouse on the soil to water. Damp is good, soggy is not.'
    :tool==='trellis'?'Click the soil beside a plant to place a trellis ('+trellises.length+' of '+MAXT+'). R rotates it.'
    :'Click a yellow or brown leaf to pick it, a tomato to harvest it, or a trellis to remove it.';
  el.textContent=msg;
}

/* ---------- plant cards ---------- */
const cards=new Map();
function addCard(P){
  const el=document.createElement('article'); el.className='card'; el.dataset.s='idle';
  el.innerHTML='<header><strong>Plant '+P.id+'</strong><span class="chip idle">Needs water</span><button class="x" type="button" aria-label="Uproot plant '+P.id+'">×</button></header>'
   +'<p class="stage"></p>'
   +'<div class="meter"><span>Water</span><div class="bar" role="img" aria-label="Soil moisture"><i class="zone"></i><i class="fill water"></i></div></div>'
   +'<div class="meter"><span>Health</span><div class="bar" role="img" aria-label="Plant health"><i class="fill health"></i><i class="pnr" title="Point of no return"></i></div></div>'
   +'<p class="note"></p>';
  $('garden').appendChild(el);
  $('gardenEmpty').hidden=true;
  el.addEventListener('click',e=>{if(e.target.closest('.x'))return;view.pan.set(P.x,0,P.z);});
  el.querySelector('.x').addEventListener('click',()=>uproot(P));
  cards.set(P.id,{el,chip:el.querySelector('.chip'),stage:el.querySelector('.stage'),water:el.querySelector('.fill.water'),health:el.querySelector('.fill.health'),note:el.querySelector('.note')});
  updateCard(P);
}
function updateCard(P){
  const c=cards.get(P.id); if(!c)return;
  const [label,cls]=P.status();
  c.el.dataset.s=cls; c.chip.textContent=label; c.chip.className='chip '+cls;
  c.stage.textContent=P.dead?'Died on day '+Math.floor(P.age):'Day '+Math.floor(P.age)+' · '+P.stageName();
  c.water.style.width=clamp(P.moisture/MOIST_MAX,0,1)*100+'%';
  c.health.style.width=P.health*100+'%';
  c.note.textContent=P.note();
}
function updateEmpty(){$('gardenEmpty').hidden=plants.length>0;}

/* ---------- wiring ---------- */
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>setSpeed(parseFloat(b.dataset.speed))));
function toggle(btn,fn){btn.addEventListener('click',()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',on);fn(on);});}
toggle($('roots'),on=>setRootsView(on));
toggle($('spin'),on=>{view.auto=on;});
toggle($('auto'),on=>{autoWater=on;toast(on?'Auto-water on. Dry soil is topped up for you.':'Auto-water off.');});
toggle($('panelBtn'),on=>{$('garden').classList.toggle('hidden',!on);});
let clearT=0;
$('clear').addEventListener('click',()=>{
  const b=$('clear');
  if(b.dataset.armed){
    for(const P of plants.slice())uproot(P);
    for(const T of trellises.slice())removeTrellis(T);
    field.fill(0); clock=0; harvested=0; harvestedRipe=0; plantCounter=0; pendingSpawns=[];
    delete b.dataset.armed; b.textContent='Clear bed'; toast('Bed cleared.'); updateEmpty();
  }else{
    b.dataset.armed='1'; b.textContent='Click again to clear'; clearTimeout(clearT);
    clearT=setTimeout(()=>{delete b.dataset.armed;b.textContent='Clear bed';},3000);
  }
});
let lastSpeed=1;
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='1')setTool('seed'); else if(e.key==='2')setTool('water'); else if(e.key==='3')setTool('trellis'); else if(e.key==='4')setTool('prune');
  else if(e.key==='r'||e.key==='R')trellisSpin+=Math.PI/4;
  else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(speed>0){lastSpeed=speed;setSpeed(0);}else setSpeed(lastSpeed||1);}
});

/* ---------- main loop ---------- */
let last=performance.now(), uiT=0, soilT=0, shT=0;
function frame(now){
  const rdt=Math.min(0.1,(now-last)/1000); last=now;
  const time=now/1000, dt=rdt*speed*BASE_RATE;
  if(dt>0){
    if(autoWater)for(const P of plants){if(P.dead||P.doomed)continue;const m=P.sampleMoisture();if(m<0.55)addWater(P.x,P.z,1.1,(0.62-m)*3*dt);}
    clock+=dt;stepField(dt);for(const P of plants)P.tick(dt);
  }
  if(pouring)addWater(pourAt.x,pourAt.z,0.8,1.5*rdt);
  updatePour(rdt); updateMarker();
  if(now-soilT>110){soilT=now;updateSoilColors();}
  let Hmax=0;
  for(const P of plants){P.visual(time);Hmax=Math.max(Hmax,P.H);}
  if(pendingSpawns.length)spawnVolunteers();
  updateCamera(Math.min(0.3,rdt),Hmax);
  if(now-uiT>200){
    uiT=now;
    $('gDay').textContent=Math.floor(clock); $('gHarv').textContent=harvested;
    for(const P of plants)updateCard(P);
    updateEmpty(); refreshTip();
  }
  if(now-shT>100){shT=now;renderer.shadowMap.needsUpdate=true;}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
setRootsView(true); setTool('seed'); setSpeed(1); updateSoilColors();
window.tomato={
  plants:()=>plants, trellises:()=>trellises, place:placeSeed, trellis:placeTrellis, water:(x,z,a)=>addWater(x,z,1.2,a), field, setSpeed, setTool,
  sim:(days)=>{const n=Math.round(days/0.1);for(let i=0;i<n;i++){clock+=0.1;stepField(0.1);for(const P of plants)P.tick(0.1);if(i%5==0)for(const P of plants)P.visual(0);}},
};
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
